<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Do not remove. Routes are real paths now, so without this every relative URL would
      resolve against the route you happen to be on: from /p/openedx/e/acme the catalog
      sheet would be fetched from /p/openedx/e/catalog-source.xlsx and 404. Both the sheet
      and the router read document.baseURI, so this one line is where the app is mounted.
      Deploying under a sub-path means changing this href and vite.config's `base` together.
    -->
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edly — Solution Estimator</title>
    <meta name="description" content="Configure a client solution bundle, price it against a rate card, and plan delivery." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
