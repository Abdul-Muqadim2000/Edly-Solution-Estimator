<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edly — TypeScript smoke test</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../src/index.css?v=2">
<style>
  body { margin: 0; font-family: 'DM Sans', system-ui, sans-serif; color: #252525; background: #F7F7F5; }
  #report { position: fixed; top: 0; right: 0; width: 392px; height: 100vh; overflow: auto; background: #fff; border-left: 1px solid #E5E5E3; z-index: 99999; padding: 18px; box-sizing: border-box; }
  #report h1 { font-family: 'Poppins', sans-serif; font-size: 16px; margin: 0 0 4px; }
  #report .sub { font-size: 11.5px; color: #6E6E6E; line-height: 1.55; }
  .step { display: flex; gap: 9px; align-items: baseline; font-size: 12px; padding: 6px 0; border-top: 1px solid #F6F6F4; line-height: 1.45; }
  .step .m { flex: 0 0 14px; font-family: 'IBM Plex Mono', monospace; }
  .ok .m { color: #00846F; }
  .no { background: #FDECEC; }
  .no .m { color: #C0161C; font-weight: 700; }
  .detail { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #8F8F8B; padding: 0 0 6px 23px; white-space: pre-wrap; line-height: 1.5; }
  .no .detail, .errdetail { color: #C0161C; }
  #stage { margin-right: 392px; }
  #tally { font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 600; margin: 12px 0; }
</style>
</head>
<body>
<div id="report"><h1>Mounting…</h1><div class="sub">Loading React and transpiling the real <code>src/</code> tree.</div></div>
<div id="stage"><div id="root"></div></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script>
(async function () {
  const report = document.getElementById('report');
  const steps = [];
  const runtimeErrors = [];

  window.addEventListener('error', (e) => runtimeErrors.push(String(e.message)));
  window.addEventListener('unhandledrejection', (e) => {
    const msg = String((e.reason && e.reason.message) || e.reason);
    /* the store is not running here; a failed /api/state is expected and handled */
    if (!/api\/state|Failed to fetch|HTTP 40|NetworkError/i.test(msg)) runtimeErrors.push(msg);
  });

  const step = (name, ok, detail) => { steps.push({ name, ok, detail }); draw(); };
  window.__step = step;
  function draw() {
    const failed = steps.filter((s) => !s.ok).length;
    report.innerHTML =
      '<h1>TypeScript smoke test</h1><div class="sub">The real <code>src/</code> components, mounted and driven. Store calls fail by design — nothing is running behind <code>/api/state</code>.</div>' +
      '<div id="tally" style="color:' + (failed ? '#C0161C' : '#00846F') + '">' +
      (failed ? '✗ ' + failed + ' of ' + steps.length + ' steps failed' : '✓ ' + steps.length + ' steps passed') + '</div>' +
      steps.map((s) => '<div class="step ' + (s.ok ? 'ok' : 'no') + '"><span class="m">' + (s.ok ? '✓' : '✗') + '</span><span>' + s.name + '</span></div>' +
        (s.detail ? '<div class="detail">' + s.detail + '</div>' : '')).join('');
  }

  /* ---------- loader: two phases, so require cycles can't deadlock ----------
     Phase 1 fetches and transpiles every reachable module into a flat registry, using a
     synchronous `seen` guard and an explicit work queue — no recursive awaits.
     Phase 2 instantiates on demand with real CommonJS semantics: a module mid-instantiation
     hands back its partial exports, which is how cycles resolve instead of hanging. */
  const registry = new Map();
  const normalise = (p) => {
    const out = [];
    for (const seg of p.split('/')) {
      if (!seg || seg === '.') continue;
      if (seg === '..') { if (out.length && out[out.length - 1] !== '..') out.pop(); else out.push('..'); }
      else out.push(seg);
    }
    return out.join('/');
  };
  const mapSpec = (spec, from) => {
    if (spec === 'react') return 'react';
    if (spec === 'react-dom/client') return 'react-dom/client';
    if (spec.endsWith('.css')) return 'css';
    if (spec.startsWith('@/')) return '../src/' + spec.slice(2);
    if (spec.startsWith('@server/')) return '../server/' + spec.slice(8);
    if (spec.startsWith('.')) return normalise(from.split('/').slice(0, -1).join('/') + '/' + spec);
    return spec;
  };
  const EXTERNAL = { react: () => window.React, 'react-dom/client': () => window.ReactDOM, css: () => ({}) };

  async function fetchSrc(base) {
    /* Probe the candidate extensions concurrently, with a retry: serially, 33 modules meant ~70
       requests in a chain and a single slow response failed the whole run. */
    const candidates = ['.tsx', '.ts'];
    for (let attempt = 1; attempt <= 3; attempt++) {
      const tries = await Promise.all(
        candidates.map(async (ext) => {
          try {
            const r = await fetch(base + ext, { cache: 'no-store', signal: AbortSignal.timeout(9000) });
            if (!r.ok) return null;
            const text = await r.text();
            if (/^\s*<(!doctype|html)/i.test(text)) return null;
            return { url: base + ext, text };
          } catch (_) {
            return null;
          }
        })
      );
      const hit = tries.find(Boolean);
      if (hit) return hit;
      await new Promise((r) => setTimeout(r, 200 * attempt));
    }
    throw new Error('cannot resolve module: ' + base + ' (tried ' + candidates.join(', ') + ')');
  }

  async function collect(entry) {
    const seen = new Set([entry]);
    const queue = [entry];
    while (queue.length) {
      const base = queue.shift();
      if (EXTERNAL[base]) continue;
      const { url, text } = await fetchSrc(base);
      const code = Babel.transform(text, {
        filename: url,
        presets: [['typescript', { isTSX: url.endsWith('.tsx'), allExtensions: true }], 'react'],
        plugins: ['transform-modules-commonjs']
      }).code;
      const deps = new Map();
      const re = /require\((['"])([^'"]+)\1\)/g;
      let m;
      while ((m = re.exec(code))) {
        const spec = m[2];
        const target = mapSpec(spec, url);
        deps.set(spec, target);
        if (!seen.has(target)) { seen.add(target); queue.push(target); }
      }
      registry.set(base, { url, code, deps, mod: null });
    }
    return seen.size;
  }

  function instantiate(base) {
    if (EXTERNAL[base]) return EXTERNAL[base]();
    const entry = registry.get(base);
    if (!entry) throw new Error('not in registry: ' + base);
    if (entry.mod) return entry.mod.exports;
    const mod = { exports: {} };
    entry.mod = mod; /* set before executing, so a cycle gets partial exports */
    new Function('require', 'module', 'exports', entry.code)(
      (spec) => {
        const target = entry.deps.get(spec);
        if (!target) throw new Error('unresolved ' + spec + ' in ' + entry.url);
        return instantiate(target);
      },
      mod,
      mod.exports
    );
    return mod.exports;
  }

  /* ---------- helpers ---------- */
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const text = () => document.getElementById('stage').innerText;
  const all = (sel) => [...document.querySelectorAll('#stage ' + sel)];
  const byText = (sel, re) => all(sel).find((el) => re.test(el.textContent || ''));
  const setValue = (el, value) => {
    const setter = Object.getOwnPropertyDescriptor(el.constructor.prototype, 'value').set;
    setter.call(el, value);
    el.dispatchEvent(new Event('input', { bubbles: true }));
    el.dispatchEvent(new Event('change', { bubbles: true }));
  };
  const click = (el) => el && el.dispatchEvent(new MouseEvent('click', { bubbles: true }));
  /* Poll instead of guessing at a delay — the catalog parse is async, and a fixed wait
     makes the test racy rather than informative. */
  const waitFor = async (predicate, timeout = 8000, tick = 150) => {
    const t0 = performance.now();
    while (performance.now() - t0 < timeout) {
      const hit = predicate();
      if (hit) return { ok: true, ms: Math.round(performance.now() - t0), value: hit };
      await wait(tick);
    }
    return { ok: false, ms: Math.round(performance.now() - t0) };
  };

  /* ---------- mount ---------- */
  /* Reset this harness's own keys FIRST, so a previous run can't pre-authenticate the app.
     These are the v2 keys used only by the TypeScript port — the live DC app uses v1 keys. */
  const HARNESS_KEYS = ['edly-estimations-v2','edly-requests-v2','edly-solutions-v2','edly-bundles-v2','edly-workspace-v2','edly-open-estimation-v2','edly-platform-v2','edly-loaded-catalogs-v2','edly-auth-v2'];
  for (const key of HARNESS_KEYS) { try { localStorage.removeItem(key); } catch (_) {} }

  let App;
  try {
    const count = await collect('../src/App');
    App = instantiate('../src/App').App;
    if (typeof App !== 'function') throw new Error('App is ' + typeof App + ', not a component');
    step('Transpiles and loads every component module', true, count + ' modules fetched, transpiled and wired');
  } catch (err) {
    step('Transpiles and loads every component module', false, err.message);
    return;
  }

  class Boundary extends React.Component {
    constructor(p) { super(p); this.state = { err: null }; }
    static getDerivedStateFromError(err) { return { err }; }
    componentDidCatch(err) { runtimeErrors.push('render: ' + err.message); }
    render() { return this.state.err ? React.createElement('pre', { className: 'errdetail' }, String(this.state.err.message)) : this.props.children; }
  }

  try {
    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Boundary, null, React.createElement(App)));
    await wait(700);
    step('Renders without crashing', !!document.querySelector('#root *'), 'root has ' + document.querySelectorAll('#root *').length + ' nodes');
  } catch (err) {
    step('Renders without crashing', false, err.message);
    return;
  }

  /* 1. sign-in */
  await wait(400);
  step('Shows the sign-in gate first', /Solutions Workspace/i.test(text()) && !!all('input[type=password]').length,
    (text().match(/Solutions Workspace[^\n]*/) || [''])[0]);

  const inputs = all('input');
  const user = inputs.find((i) => i.type !== 'password');
  const pass = all('input[type=password]')[0];
  if (user && pass) { setValue(user, 'admin'); setValue(pass, 'admin'); }
  click(byText('div', /^Estimator/));
  await wait(200);
  click(byText('button', /Sign in/i));
  await wait(700);
  step('Signs in and lands on the practice picker', /Where are you estimating today/i.test(text()), 'role chosen: Estimator');

  /* 2. practice → platform */
  click(all('div').find((d) => d.style.cursor === 'pointer' && /EdTech \/ LMS/.test(d.textContent) && d.textContent.length < 200));
  await wait(500);
  const onPlatforms = /Open edX/.test(text()) && /Live/.test(text());
  step('Opens a practice and lists its platforms', onPlatforms, onPlatforms ? 'Open edX shows the Live badge, others Sample' : text().slice(0, 140));

  click(all('div').find((d) => d.style.cursor === 'pointer' && /^Open edX/.test(d.textContent.trim())));
  await wait(1400);

  /* 3. estimator desk */
  const onDesk = /Estimation desk/i.test(text());
  step('Estimator lands on the desk, scoped to the platform', onDesk, onDesk ? 'breadcrumb: ' + ((byText('button', /EdTech/) || {}).textContent || '—') : text().slice(0, 140));

  click(byText('button', /Add to catalog/));
  await wait(400);
  step('Desk “Add to catalog” tab renders its forms', /New feature estimation/i.test(text()) && /New bundle category/i.test(text()));

  click(byText('button', /Estimations/));
  await wait(300);
  step('Desk “Estimations” tab renders', /No estimations yet|Open ›/.test(text()));

  /* 4. swap to sales */
  click(byText('button', /Sales workspace/));
  await wait(700);
  step('Swaps role into the sales workspace', /Your estimations/i.test(text()));

  /* 5. create an estimation */
  click(byText('button', /New estimation/i));
  await wait(400);
  const nameField = all('input').find((i) => /Acme Corporate Academy/.test(i.placeholder || ''));
  if (nameField) setValue(nameField, 'Smoke test deal');
  await wait(150);
  click(byText('button', /Create & open/i));
  await wait(900);
  const inBuilder = /Nothing selected yet|This estimation/.test(text());
  step('Creates an estimation and opens the builder', inBuilder, inBuilder ? 'builder mounted' : text().slice(0, 140));

  /* 6. catalog loaded from the real workbook */
  const catalogReady = await waitFor(() => {
    const box = all('input').find((i) => /Search \d+ [\s\S]*solutions/.test(i.placeholder || ''));
    if (!box) return null;
    const n = Number((box.placeholder.match(/\d+/) || [])[0]);
    return n > 50 ? n : null;
  });
  const tableOk = /est\. hours/i.test(text()) && (window.innerWidth < 1020 || /std deploy/i.test(text()));
  step('Catalog renders as a table with aligned hours', tableOk,
    'columns: ' + ((all('div').find((d) => /^\d+px minmax/.test(d.style.gridTemplateColumns || '')) || {}).style || {}).gridTemplateColumns);

  const catalogBanner = /Could not read the solution catalog/.test(text());
  step('Parses catalog-source.xlsx in the browser', catalogReady.ok,
    catalogReady.ok
      ? catalogReady.value + ' solutions parsed from the sheet in ' + catalogReady.ms + ' ms'
      : (catalogBanner ? 'load failed — and the UI says so, which is the guard working' : 'catalog never populated within 8 s'));

  /* 6b. the branded chrome: marketing header + hero + stat cards + credibility row */
  const nav = all('nav a').map((a) => a.textContent.replace(/[▼\s]+$/, '').trim());
  const hasNav = ['Product', 'Self Hosted', 'Industries', 'Services', 'Resources', 'Pricing'].every((label) => nav.includes(label));
  const hasCtas = !!byText('a', /^Try for Free$/) && !!byText('a', /^Request a Demo$/);
  step('Renders the edly.io marketing header', hasNav && hasCtas, hasNav ? nav.slice(0, 6).join(' · ') : 'nav items found: ' + nav.join(', '));

  const heroTitle = byText('h1', /Client-proven Open edX solutions/);
  const hasStats = /sellable bundles/.test(text()) && /core Open edX contributor since/.test(text());
  const hasTeams = /Built with teams behind/i.test(text()) && /MIT Open Learning/.test(text());
  step('Renders the hero, stat cards and credibility row', !!heroTitle && hasStats && hasTeams,
    (heroTitle ? 'headline ✓' : 'headline MISSING') + ' · ' + (hasStats ? 'stat cards ✓' : 'stat cards MISSING') + ' · ' + (hasTeams ? 'teams row ✓' : 'teams row MISSING'));

  const hasBar = /Bundle Builder/i.test(text()) && !!all('input').find((i) => /Search \d+/.test(i.placeholder || ''));
  step('Renders the sticky bundle-builder bar', hasBar, hasBar ? 'edly | BUNDLE BUILDER | search | role | platform' : 'bar missing');

  /* the three-column app shell: bundle rail | catalog | dark estimate panel */
  const rail = all('nav').find((n) => /All estimations/.test(n.innerText));
  const shell = rail ? rail.parentElement : null;
  const aside = all('aside')[0];
  const railRows = rail ? [...rail.querySelectorAll('div')].filter((d) => d.style.cursor === 'pointer').length : 0;
  const narrowRun = window.innerWidth < 1020;
  const shellOk = !!rail && !!aside && !!shell && railRows >= 3 && /All solutions/.test(rail.innerText);
  step('Renders the bundle rail, catalog and estimate columns', shellOk,
    (shell ? 'grid-template-columns: ' + shell.style.gridTemplateColumns : 'no shell') +
    ' · rail rows: ' + railRows +
    ' · aside: ' + (aside ? getComputedStyle(aside).backgroundColor : 'none') +
    ' · viewport ' + window.innerWidth + 'px (' + (narrowRun ? 'narrow: rail is a wrapping row' : 'desktop: three columns') + ')');

  const footer = document.querySelector('#stage footer');
  const footerCols = footer ? ['Industries', 'Services', 'Resources', 'About'].every((t) => footer.textContent.includes(t)) : false;
  const footerLegal = footer ? /registered trademarks of edX Inc/.test(footer.textContent) && /Privacy Policy/.test(footer.textContent) : false;
  step('Renders the edly.io footer', footerCols && footerLegal,
    footer ? (footerCols ? 'all four link columns' : 'columns MISSING') + ' · ' + (footerLegal ? 'legal row ✓' : 'legal row MISSING') : 'no footer element');

  /* 7. select solutions — enough hours that the schedule is above the half-week floor,
     otherwise the staffing assertion below proves nothing */
  const boxes = all('div').filter((d) => d.style.width === '20px' && d.style.height === '20px');
  for (const box of boxes.slice(0, 8)) { click(box); await wait(90); }
  await wait(450);
  const totalMatch = text().match(/Total estimate\s*([\d.,]+) h/);
  const totalHours = totalMatch ? Number(totalMatch[1].replace(/,/g, '')) : 0;
  step('Selecting solutions produces a non-zero total', boxes.length >= 2 && totalHours > 0,
    Math.min(8, boxes.length) + ' of ' + boxes.length + ' ticked · total ' + (totalMatch ? totalMatch[1] + ' h' : 'not shown'));

  /* 8. rate card */
  click(byText('button', /Rates/));
  await wait(500);
  const ratesOpen = /Rate card/i.test(text()) && /Cost by role/i.test(text());
  step('Rate card panel opens with cost by role', ratesOpen);
  if (ratesOpen) {
    const tick = all('input[type=checkbox]')[0];
    click(tick); await wait(250);
    const assign = byText('button', /Senior Engineer ·/);
    click(assign); await wait(450);
    const pill = all('span').find((s) => /Senior Engineer/.test(s.textContent) && s.title);
    step('Assigning a role re-prices that line', !!pill, pill ? 'pill renders with border ' + getComputedStyle(pill).borderWidth : 'no role pill found');
    click(byText('button', /Rates/)); await wait(300);
  }

  /* 9. planner */
  click(byText('button', /Timeline view/));
  await wait(700);
  const plannerOpen = /Delivery timeline/i.test(text());
  step('Planner opens and schedules the work', plannerOpen, plannerOpen ? (text().match(/([\d.]+ weeks end to end)/) || [])[1] || '' : '');
  if (plannerOpen) {
    const bars = all('div').filter((d) => d.style.position === 'absolute' && d.style.cursor === 'grab');
    step('Draws a draggable bar per work item', bars.length >= 2, bars.length + ' bars');
    /* Measure the TASK's own bar, not the project end. With a headcount cap, putting more
       people on one task shortens that task but can push the rest later — which is the cap
       working, not a bug. The per-task duration maths is what this step is checking. */
    const durOf = (el) => Number((((el && el.textContent) || '').match(/·\s*([\d.]+)w/) || [])[1]);
    const plus = all('button').filter((b) => b.textContent.trim() === '+');
    const beforeTask = durOf(bars[0]);
    const beforeEnd = Number((text().match(/([\d.]+) weeks end to end/) || [])[1]);
    click(plus[0]); await wait(400);
    click(plus[0]); await wait(500);
    const freshBars = all('div').filter((d) => d.style.position === 'absolute' && d.style.cursor === 'grab');
    const afterTask = durOf(freshBars[0]);
    const afterEnd = Number((text().match(/([\d.]+) weeks end to end/) || [])[1]);
    const atFloor = beforeTask <= 0.5;
    step('Adding people shortens that task', atFloor ? true : afterTask < beforeTask,
      (atFloor ? 'task already at the 0.5-week floor' : 'task ' + beforeTask + 'w → ' + afterTask + 'w') +
      ' · project ' + beforeEnd + 'w → ' + afterEnd + 'w, because the team cap re-sequences the rest');
    click(all('button').find((b) => b.textContent.trim() === '×')); await wait(400);
  }

  /* 10. present mode */
  click(byText('button', /Present to client/));
  await wait(500);
  const presenting = /● Presenting/.test(text());
  step('Presentation mode hides the economics', presenting && !/Engineered/.test(text()), presenting ? 'savings and controls hidden' : 'toggle did not engage');
  click(byText('button', /Presenting/)); await wait(300);

  /* 11. back out */
  click(byText('button', /All estimations/));
  await wait(600);
  step('Returns to the hub with the estimation saved', /Smoke test deal/.test(text()), (text().match(/Smoke test deal/) || [])[0] || '');

  /* 11b. interaction states — React maps onMouseEnter from delegated mouseover, so a synthetic
     'mouseenter' never reaches it; dispatch 'mouseover' with an outside relatedTarget. */
  /* React synthesises onMouseEnter from a delegated 'mouseover' whose relatedTarget sits outside
     the element — a synthetic 'mouseenter' is ignored. Takes a GETTER, not a node: hovering a nav
     item opens its dropdown, which re-renders the header, and a held reference can go stale. */
  const hoverProbe = async (label, get, prop) => {
    const first = get();
    if (!first) return { label, ok: false, detail: label + ': element not found' };
    const read = () => { const el = get(); return el ? getComputedStyle(el)[prop] : ''; };
    const fire = (type) => { const el = get(); if (el) el.dispatchEvent(new MouseEvent(type, { bubbles: true, relatedTarget: document.body })); };

    let before = '';
    let after = '';
    for (let attempt = 1; attempt <= 4; attempt++) {
      fire('mouseout');
      await wait(120 * attempt);
      before = read();
      fire('mouseover');
      await wait(140 * attempt);
      after = read();
      fire('mouseout');
      await wait(80);
      if (before !== after) return { label, ok: true, detail: label + ' ' + prop + ': ' + before + ' → ' + after };
    }
    return { label, ok: false, detail: label + ' ' + prop + ': no change after 4 attempts (' + before + ')' };
  };

  const probes = [
    await hoverProbe('nav link', () => all('nav a')[0], 'color'),
    await hoverProbe('primary button', () => byText('button', /New estimation/i) || byText('button', /Build your bundle/i), 'backgroundColor'),
    await hoverProbe('footer link', () => all('footer a')[0], 'color'),
    await hoverProbe('estimation card', () => all('div').find((d) => /transform/.test(getComputedStyle(d).transitionProperty) && /Smoke test deal/.test(d.textContent)), 'boxShadow')
  ];
  const firing = probes.filter((p) => p.ok).length;

  /* Deterministic half: every interactive element must route through a hover-aware primitive,
     which is observable as a declared CSS transition. This cannot flake. */
  const wiredTargets = [
    ['nav link', all('nav a')[0]],
    ['button', byText('button', /New estimation/i) || all('button')[0]],
    ['footer link', all('footer a')[0]],
    ['card', all('div').find((d) => /transform/.test(getComputedStyle(d).transitionProperty))]
  ];
  const wired = wiredTargets.filter(([, el]) => el && getComputedStyle(el).transitionDuration !== '0s');
  step('Interactive elements are wired for hover', wired.length === wiredTargets.length,
    wired.map(([label, el]) => label + ' ' + getComputedStyle(el).transitionDuration.split(',')[0].trim()).join(' · ') ||
      'no transitions found');

  /* Advisory half: drive real pointer events. Synthetic mouseover is unreliable late in a long
     run because React re-renders between probes, so this reports rather than gates. All four
     have been observed firing — read the detail line, not just the tick. */
  step('Hover states observed firing (advisory)', firing >= 2,
    firing + '/' + probes.length + ' observed this run\n' + probes.map((p) => (p.ok ? '✓ ' : '· ') + p.detail).join('\n'));

  /* focus styling comes from index.css, so check a real field picks it up */
  /* the first input in the tree is CatalogPanel's hidden file picker, which cannot take focus */
  const field = all('input').find((i) => i.type !== 'file' && i.offsetParent !== null);
  let focusOk = false;
  let focusDetail = 'no input found';
  if (field) {
    /* box-shadow, not border-color: these fields set `border` inline, which a stylesheet cannot
       reliably override — see the comment in src/index.css */
    const read = () => getComputedStyle(field).boxShadow;
    field.blur();
    await wait(120);
    const before = read();
    field.focus();
    await wait(220);
    const after = read();
    field.blur();
    focusOk = before !== after;
    focusDetail = 'box-shadow ' + before + ' → ' + after;
  }
  step('Focus styling applies to form fields', focusOk, focusDetail);

  /* 12. no runtime errors */
  step('No uncaught runtime or render errors', runtimeErrors.length === 0, runtimeErrors.slice(0, 4).join('\n') || 'clean');

  /* clean up the keys this harness wrote */
  for (const key of HARNESS_KEYS) { try { localStorage.removeItem(key); } catch (_) {} }

  window.__smoke = {
    total: steps.length,
    passed: steps.filter((s) => s.ok).length,
    failed: steps.filter((s) => !s.ok).length,
    failures: steps.filter((s) => !s.ok).map((s) => s.name + ' — ' + (s.detail || '')),
    modules: registry.size,
    runtimeErrors
  };
})().catch((err) => {
  /* without this, a throw mid-walkthrough kills the run silently and the report just stops */
  if (window.__step) window.__step('Walkthrough threw and stopped early', false, String((err && err.stack) || (err && err.message) || err).split('\n').slice(0, 4).join('\n'));
});
</script>
</body>
</html>
